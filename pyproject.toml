[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-rag"
version = "0.1.0"
description = "Hybrid-search RAG with inline citations, evaluation, A/B harness, and an MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kartik Dua" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pypdf>=4.0",
    "anthropic>=0.39",
    "httpx>=0.27",
    "sse-starlette>=2.0",
    "typer>=0.12",
    "rich>=13.7",
    "mcp>=1.2",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.7",
    "torch>=2.2",
]
agent = [
    "langgraph>=0.2",
]
pg = [
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
hybridrag = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*", "eval*", "mcp_server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
